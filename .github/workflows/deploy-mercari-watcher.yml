name: Deploy mercari-watcher (self-hosted on Synology)

on:
  push:
    branches: [main]
    paths:
      - "mercari-watcher/**"
      - ".github/workflows/deploy-mercari-watcher.yml"
  workflow_dispatch:

concurrency:
  group: deploy-mercari-watcher
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build & deploy
        env:
          ENV_FILE: /tmp/runner-work/.env
        run: bash mercari-watcher/deploy.sh

      - name: Smoke test (healthz qua container)
        run: |
          for i in $(seq 1 15); do
            if docker exec mercari-watcher node -e \
              "fetch('http://127.0.0.1:8788/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then
              echo "✓ healthy (lần $i)"; exit 0
            fi
            echo "  lần $i: chưa sẵn sàng, đợi..."; sleep 2
          done
          echo "❌ smoke test thất bại — log container:"; docker logs --tail 40 mercari-watcher; exit 1

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TG_TOKEN" ] && { echo "(chưa set TELEGRAM secrets — bỏ qua notify)"; exit 0; }
          curl -s --max-time 10 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d "chat_id=${TG_CHAT}" \
            -d "text=🚀 mercari-watcher deploy ${{ job.status }} | commit ${{ github.sha }}" >/dev/null || true
